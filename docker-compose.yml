services:
  artifact:
    build:
      context: .
      # 小内存服务器把 ARTIFACT_DOCKERFILE 设为 Dockerfile.prebuilt，见 README
      dockerfile: ${ARTIFACT_DOCKERFILE:-Dockerfile}
      args:
        VERSION: "0.1.0"
    image: vps-artifact:0.1.0
    container_name: artifact
    restart: unless-stopped
    ports:
      - "${ARTIFACT_HOST_PORT:-8790}:8790"
    env_file:
      - path: .env
        required: false
    environment:
      ARTIFACT_DATA_DIR: /data
      ARTIFACT_PORT: "8790"
      GOMEMLIMIT: 200MiB
    volumes:
      - ./data:/data
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
